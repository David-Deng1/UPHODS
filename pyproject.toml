[project]
name = "uphods"
version = "0.1.0"
description = "Code and benchmark results for UPHODS (user preference-driven hybrid optimization with dynamic switching)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uphods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
